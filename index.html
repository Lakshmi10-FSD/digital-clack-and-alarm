<!DOCTYPE html>
<html>
<head>
  <title>Digital Clock + Alarm</title>
  <script src="https://cdn.tailwindcss.com"></script> 
</head> 

<body id="body" class="bg-gray-900 flex items-center justify-center h-screen text-white transition"> 

<div class="bg-gray-800 p-8 rounded-xl text-center shadow-lg w-80"> 

  <h1 class="text-2xl font-bold mb-2">🕒 Digital Clock</h1> 

  <!-- DATE -->
  <p id="date" class="text-sm text-gray-300 mb-3"></p>

  <!-- CLOCK --> 
  <div id="clock" class="text-4xl font-mono mb-2">00:00:00</div> 
  <p id="format" class="text-xs text-gray-400 mb-4">24 Hour Format</p>

  <!-- ALARM INPUT --> 
  <input  
    type="time"  
    id="alarmTime"  
    class="text-black p-2 rounded w-full mb-4" 
  > 

  <!-- BUTTONS -->
  <button onclick="setAlarm()" class="bg-green-500 px-4 py-2 rounded hover:bg-green-600 w-full mb-2"> 
    Set Alarm 
  </button> 

  <button onclick="clearAlarm()" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600 w-full mb-2"> 
    Clear Alarm 
  </button> 

  <button onclick="toggleFormat()" class="bg-purple-500 px-4 py-2 rounded hover:bg-purple-600 w-full mb-2"> 
    Toggle 12/24 Hour 
  </button> 

  <button onclick="toggleTheme()" class="bg-blue-500 px-4 py-2 rounded hover:bg-blue-600 w-full mb-2"> 
    Toggle Theme 
  </button> 

  <button onclick="stopAlarm()" class="bg-yellow-500 px-4 py-2 rounded hover:bg-yellow-600 w-full mb-2"> 
    Stop Alarm 
  </button> 

  <!-- ✅ NEW SNOOZE BUTTON -->
  <button onclick="snoozeAlarm()" class="bg-indigo-500 px-4 py-2 rounded hover:bg-indigo-600 w-full"> 
    Snooze 5 Min 
  </button> 

  <p id="status" class="mt-4 text-sm text-yellow-400"></p> 

</div> 

<!-- SOUND -->
<audio id="alarmSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>  
 
<script>   
  let alarmTime = localStorage.getItem("alarmTime") || null; 
  let snoozeTime = null; // ✅ NEW
  let isRinging = false; 
  let is24Hour = true; 
 
  // CLOCK FUNCTION   
  function updateClock() {   
    let now = new Date();   
 
    let h = now.getHours(); 
    let m = String(now.getMinutes()).padStart(2, '0');   
    let s = String(now.getSeconds()).padStart(2, '0');   
 
    let displayHour = h; 
 
    if (!is24Hour) { 
      displayHour = h % 12 || 12; 
      displayHour = String(displayHour).padStart(2, '0'); 
    } else { 
      displayHour = String(h).padStart(2, '0'); 
    } 
 
    let currentTime = `${displayHour}:${m}:${s}`;   
    document.getElementById("clock").innerText = currentTime;   
 
    // DATE  
    document.getElementById("date").innerText = now.toDateString();  
 
    // CURRENT TIME HH:MM
    let currentHM = `${String(h).padStart(2,'0')}:${m}`;

    // CHECK ALARM + SNOOZE
    if (
      (alarmTime === currentHM || snoozeTime === currentHM) 
      && !isRinging
    ) {   
      let sound = document.getElementById("alarmSound"); 
      sound.loop = true; 
      sound.play();  
      document.getElementById("status").innerText = "⏰ Alarm Ringing!";  
      isRinging = true;  
    }   
  }   
 
  setInterval(updateClock, 1000);   
 
  // SET ALARM   
  function setAlarm() {   
    let input = document.getElementById("alarmTime").value;   
 
    if (!input) {   
      alert("Please select time!");   
      return;   
    }   
 
    alarmTime = input;   
    snoozeTime = null; // ✅ reset snooze
    localStorage.setItem("alarmTime", input); 
    isRinging = false;  
    document.getElementById("status").innerText = "✅ Alarm set for " + input;   
  }   
 
  // CLEAR ALARM  
  function clearAlarm() {  
    alarmTime = null;  
    snoozeTime = null; // ✅ clear snooze also
    localStorage.removeItem("alarmTime"); 
    document.getElementById("status").innerText = "❌ Alarm cleared";  
  }  
 
  // STOP ALARM SOUND  
  function stopAlarm() {  
    let sound = document.getElementById("alarmSound");  
    sound.pause();  
    sound.currentTime = 0;  
    isRinging = false;  
    document.getElementById("status").innerText = "🔕 Alarm stopped";  
  }  

  // ✅ SNOOZE FUNCTION
  function snoozeAlarm() {
    if (!isRinging) {
      alert("Alarm is not ringing!");
      return;
    }

    let now = new Date();
    now.setMinutes(now.getMinutes() + 5);

    let h = String(now.getHours()).padStart(2, '0');
    let m = String(now.getMinutes()).padStart(2, '0');

    snoozeTime = `${h}:${m}`;

    stopAlarm();

    document.getElementById("status").innerText =
      "😴 Snoozed for 5 minutes (Next: " + snoozeTime + ")";
  }
 
  // THEME TOGGLE  
  function toggleTheme() {  
    let body = document.getElementById("body");  
 
    if (body.classList.contains("bg-gray-900")) {  
      body.classList.remove("bg-gray-900", "text-white");  
      body.classList.add("bg-white", "text-black");  
    } else {  
      body.classList.remove("bg-white", "text-black");  
      body.classList.add("bg-gray-900", "text-white");  
    }  
  }  
 
  // 12/24 FORMAT TOGGLE 
  function toggleFormat() { 
    is24Hour = !is24Hour; 
    document.getElementById("format").innerText = is24Hour ? "24 Hour Format" : "12 Hour Format"; 
  } 
</script>   
 
</body>   
</html>
