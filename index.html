<!DOCTYPE html>
<html>
<head>
  <title>Digital Clock + Alarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center h-screen text-white">

<div class="bg-gray-800 p-8 rounded-xl text-center shadow-lg w-80">

  <h1 class="text-2xl font-bold mb-4">🕒 Digital Clock</h1>

  <!-- Clock -->
  <div id="clock" class="text-4xl font-mono mb-6">00:00:00</div>

  <!-- Alarm Input -->
  <input 
    type="time" 
    id="alarmTime" 
    class="text-black p-2 rounded w-full mb-4"
  >

  <!-- Button -->
  <button 
    onclick="setAlarm()" 
    class="bg-green-500 px-4 py-2 rounded hover:bg-green-600 w-full"
  >
    Set Alarm
  </button>

  <p id="status" class="mt-4 text-sm text-yellow-400"></p>

</div>

<script>
  let alarmTime = null;

  // CLOCK FUNCTION
  function updateClock() {
    let now = new Date();

    let h = String(now.getHours()).padStart(2, '0');
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    let currentTime = `${h}:${m}:${s}`;
    document.getElementById("clock").innerText = currentTime;

    // CHECK ALARM
    if (alarmTime === `${h}:${m}`) {
      alert("⏰ Alarm Ringing!");
      alarmTime = null;
    }
  }

  setInterval(updateClock, 1000);

  // SET ALARM
  function setAlarm() {
    let input = document.getElementById("alarmTime").value;

    if (!input) {
      alert("Please select time!");
      return;
    }

    alarmTime = input;
    document.getElementById("status").innerText = "Alarm set for " + input;
  }
</script>

</body>
</html>
